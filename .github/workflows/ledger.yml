name: Record picks

# Every hour: save the model's pick for every upcoming game, pick of the day and the day's parlay
# into data/ledger-<sport>.json, lock them when games start and grade them after the final.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record and grade picks
        continue-on-error: true
        run: node learn/ledger.mjs
      - name: Commit the record
        run: |
          git config user.name "sideline-bot"
          git config user.email "sideline-bot@users.noreply.github.com"
          git add data/ledger-*.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Record picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
