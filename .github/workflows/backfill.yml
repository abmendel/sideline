name: Backfill history (model upgrade)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch more seasons, box scores and betting lines
        run: node learn/learn.mjs --collect-only
      - name: Commit
        run: |
          git config user.name "sideline-bot"
          git config user.email "sideline-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Backfill history $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
