name: ESPN soccer samples
on:
  push:
    branches: [espn-samples]
    paths: [.github/workflows/samples.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: espn-samples }
      - name: Fetch samples
        run: |
          set +e
          mkdir -p s
          S=https://site.api.espn.com/apis/site/v2/sports/soccer
          W=https://site.web.api.espn.com/apis/common/v3/sports/soccer
          g(){ curl -sL --compressed -m 30 -A 'Mozilla/5.0' "$2" -o "s/$1.json"; echo "$1 $(wc -c < s/$1.json) $2" >> s/_index.txt; }
          rm -f s/*.json s/_index.txt
          g sb_next "$S/eng.1/scoreboard?dates=20261121&limit=100"
          g sb_all_next "$S/all/scoreboard?dates=20261121"
          g sb_all_today "$S/all/scoreboard?dates=20261112"
          g sb_ucl "$S/uefa.champions/scoreboard?dates=20261104"
          g sb_mls "$S/usa.1/scoreboard"
          PRE=$(python3 -c "import json;d=json.load(open('s/sb_next.json'));print(d['events'][0]['id'])")
          g summary_pre "$S/eng.1/summary?event=$PRE"
          UE=$(python3 -c "import json;d=json.load(open('s/sb_ucl.json'));print(d['events'][0]['id'])")
          g summary_ucl "$S/uefa.champions/summary?event=$UE"
          LIVE=$(python3 -c "import json;d=json.load(open('s/sb_all_today.json'));e=[x for x in d['events'] if x['status']['type']['state']=='in'];print(e[0]['id'] if e else '')")
          [ -n "$LIVE" ] && g summary_live "$S/all/summary?event=$LIVE"
          g teams_ucl "$S/uefa.champions/teams"
          g teams_wc "$S/fifa.world/teams"
          g core_league "https://sports.core.api.espn.com/v2/sports/soccer/leagues/eng.1"
          cat s/_index.txt
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add s && git commit -m "samples" && git push origin espn-samples
