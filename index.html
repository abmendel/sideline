<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sideline · Live Sports</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  :root{color-scheme:light dark;--bg:#f2f2f7;--dim:#6e6e76;--acc:#c2410c}
  @media (prefers-color-scheme:dark){:root:not(.light){--bg:#000;--dim:#98989f;--acc:#ff8a3d}}
  :root.dark{--bg:#000;--dim:#98989f;--acc:#ff8a3d}
  :root.light{--bg:#f2f2f7;--dim:#6e6e76;--acc:#c2410c}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
  :root{--text:#1c1c1e}
  @media (prefers-color-scheme:dark){:root:not(.light){--text:#f5f5f7}}
  :root.dark{--text:#f5f5f7} :root.light{--text:#1c1c1e}
  /* sports: kept alive once opened; switching cross-fades between them */
  iframe.sport{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;visibility:hidden;opacity:0;transform:scale(.985);transition:opacity .32s ease,transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s}
  iframe.sport.on{visibility:visible;opacity:1;transform:none;transition:opacity .32s ease,transform .42s cubic-bezier(.2,.8,.2,1)}

  /* intro: the ball roll call and the wordmark, until the first sport is ready */
  .boot{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);color:var(--dim);text-align:center;transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1),visibility 0s .6s}
  .boot.gone{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
  .balls{display:flex;gap:14px;justify-content:center;height:54px;align-items:flex-end;margin-bottom:18px;font-size:30px;line-height:1}
  .balls span{display:inline-block;transform-origin:50% 100%;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both,hop 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * 90ms),calc(900ms + var(--i) * 120ms)}
  .word{font:800 44px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;color:var(--text);display:flex;justify-content:center;overflow:hidden;padding:4px 0}
  .word b{display:inline-block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(380ms + var(--i) * 45ms)}
  .word b.dot{color:var(--acc)}
  .tagline{margin-top:8px;font-size:14px;animation:fade .6s ease 900ms both}
  .track{width:160px;height:4px;border-radius:4px;margin:20px auto 0;overflow:hidden;background:color-mix(in srgb,var(--dim) 18%,transparent);animation:fade .4s ease 1s both}
  .track i{display:block;width:40%;height:100%;border-radius:4px;background:var(--acc);animation:sweep 1.1s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes drop{0%{opacity:0;transform:translateY(-60px) scaleY(1.1)}60%{opacity:1;transform:translateY(0) scale(1.15,.85)}80%{transform:translateY(-6px) scale(.95,1.05)}100%{transform:none}}
  @keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-10px) rotate(-8deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(260%)}}

  /* switching sports: the sport's ball pops up in the middle for a beat */
  .swap{position:fixed;left:50%;top:50%;z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);font:700 15px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;color:var(--text)}
  .swap span{font-size:56px;line-height:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
  .swap.go{animation:swap .9s cubic-bezier(.2,.8,.2,1) both}
  .swap.go span{animation:spin .9s cubic-bezier(.3,1.3,.5,1) both}
  @keyframes swap{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.92)}}
  @keyframes spin{from{transform:rotate(-180deg) scale(.6)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){
    .balls span,.word b,.tagline,.track,.track i,.swap,.swap span{animation:none!important}
    iframe.sport,.boot{transition:none} .swap{display:none}
  }
</style>
</head>
<body>
<div class="boot" id="boot" role="status" aria-label="Loading Sideline"><div>
  <div class="balls" aria-hidden="true"><span style="--i:0">🏀</span><span style="--i:1">🏈</span><span style="--i:2">⚾</span><span style="--i:3">🏒</span><span style="--i:4">⚽</span></div>
  <div class="word" aria-hidden="true"><b style="--i:0">S</b><b style="--i:1">i</b><b style="--i:2">d</b><b style="--i:3">e</b><b style="--i:4">l</b><b style="--i:5">i</b><b style="--i:6">n</b><b style="--i:7">e</b><b class="dot" style="--i:8">.</b></div>
  <div class="tagline">Live scores · picks · predictions</div>
  <div class="track"><i></i></div>
</div></div>
<div class="swap" id="swap" aria-hidden="true"><span></span><b></b></div>
<script>
(() => {
'use strict';
/* =====================================================================
   SPORTS REGISTRY
   To add a sport: put its dashboard page in sports/ and add one line here.
   Order here = order of the switcher pills (Alt+1, Alt+2… also switch).
   ===================================================================== */
const SPORTS = [
  { id: 'nba', name: 'NBA', icon: '🏀', file: 'sports/nba.html' },
  { id: 'nfl', name: 'NFL', icon: '🏈', file: 'sports/nfl.html' },
  { id: 'mlb', name: 'MLB', icon: '⚾', file: 'sports/mlb.html' },
  { id: 'nhl', name: 'NHL', icon: '🏒', file: 'sports/nhl.html' },
  { id: 'soccer', name: 'Soccer', icon: '⚽', file: 'sports/soccer.html' }
];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const frames = {};          // id -> iframe (created the first time a sport is opened, then kept alive)
let current = null;
let theme = store.get('hub.appearance');   // 'auto' | 'light' | 'dark'; unset = follow the system
const byId = id => SPORTS.find(s => s.id === id);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const bootAt = performance.now(), MIN_INTRO = RM ? 0 : 1250;
let bootDone = false;
function hideBoot() {                              // the intro plays at least once through, then lifts away
  if (bootDone) return; bootDone = true;
  setTimeout(() => document.getElementById('boot').classList.add('gone'), Math.max(0, MIN_INTRO - (performance.now() - bootAt)));
}
setTimeout(hideBoot, 9000);                        // never hold the page hostage if a sport is slow
function swapFx(id) {                              // the sport's ball pops up for a beat when you switch
  if (RM || !bootDone) return;
  const s = byId(id), el = document.getElementById('swap');
  el.querySelector('span').textContent = s.icon; el.querySelector('b').textContent = s.name;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
const list = () => SPORTS.map(({ id, name, icon }) => ({ id, name, icon }));
const applyShellTheme = () => { const r = document.documentElement; r.classList.toggle('dark', theme === 'dark'); r.classList.toggle('light', theme === 'light'); };
applyShellTheme();

function frameFor(id) {
  if (frames[id]) return frames[id];
  const s = byId(id), f = document.createElement('iframe');
  f.className = 'sport'; f.title = `${s.name} dashboard`; f.src = s.file; f.dataset.sport = id;
  f.addEventListener('load', () => { if (current === id) hideBoot(); }, { once: true });
  document.body.appendChild(f);
  return (frames[id] = f);
}
function show(id, fromHash) {
  if (!byId(id)) id = SPORTS[0].id;
  if (id === current) return;
  if (current) swapFx(id);
  current = id;
  const f = frameFor(id);
  Object.values(frames).forEach(x => x.classList.toggle('on', x === f));
  document.title = `${byId(id).name} · Sideline`;
  store.set('hub.sport', id);
  if (!fromHash && location.hash.slice(1) !== id) { try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } }
  try { f.contentWindow && f.contentWindow.focus(); } catch (e) {}
}
const send = (f, msg) => { try { f.contentWindow.postMessage({ hub: 1, ...msg }, '*'); } catch (e) {} };

window.addEventListener('message', e => {
  const d = e.data; if (!d || !d.hub) return;
  const f = Object.values(frames).find(x => x.contentWindow === e.source); if (!f) return;
  if (d.type === 'hello') {                       // a sport page finished loading: give it the switcher list
    send(f, { type: 'sports', list: list(), current: f.dataset.sport });
    if (theme) send(f, { type: 'theme', tv: theme });
    if (f.dataset.sport === current) hideBoot();
  }
  if (d.type === 'switch' && byId(d.id)) show(d.id);
  if (d.type === 'theme' && ['auto', 'light', 'dark'].includes(d.tv) && d.tv !== theme) {   // keep the appearance setting in sync across sports
    theme = d.tv; store.set('hub.appearance', theme); applyShellTheme();
    Object.values(frames).forEach(x => { if (x !== f) send(x, { type: 'theme', tv: theme }); });
  }
});
function takeSync() {
  const m = /^#sync=([a-z0-9-]{20,40})$/i.exec(location.hash || ''); if (!m) return false;
  store.set('sideline.sync.code', m[1].toLowerCase());
  try { history.replaceState(null, '', '#' + (store.get('hub.sport') || SPORTS[0].id)); } catch (e) {}
  return true;
}
takeSync();
window.addEventListener('hashchange', () => { if (takeSync()) return; show(location.hash.slice(1), true); });

show(byId(location.hash.slice(1)) ? location.hash.slice(1) : byId(store.get('hub.sport')) ? store.get('hub.sport') : SPORTS[0].id);
})();
</script>
</body>
</html>
